# CI-01: this workflow is the repository's regression gate. In GitHub
# repository settings, add the `quality-gate` job (check name
# "Format, analyze, test") as a required status check on `main` so a failing
# commit cannot merge; that branch-protection rule cannot be stored in-repo.
name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter compact

      # The default-off property of the release-safe LLM diagnostics channel is
      # already covered by the suite above, but every assertion about the
      # allowlist-when-enabled behaviour is skipped while the compile-time flag
      # is absent, which would leave the security control untested. Run the two
      # suites that exercise it with the flag explicitly enabled.
      - name: Test safe LLM diagnostics allowlist (opt-in enabled)
        run: >
          flutter test test/core/debug/safe_llm_diagnostics_test.dart
          test/services/llm_streaming_reliability_test.dart
          --reporter compact
          --dart-define=LT_SAFE_LLM_DIAGNOSTICS=true

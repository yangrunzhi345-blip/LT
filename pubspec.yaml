name: lt_dialogue
description: AI-driven Scene Dialogue, Resource Library & Settings System
publish_to: 'none'
version: 1.1.10+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^10.2.0
  connectivity_plus: ^7.1.1
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  image: ^4.3.0
  flutter_svg: ^2.2.2
  pointycastle: ^4.0.0
  equatable: ^2.1.0
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5

# objective_c 9.6.1 是上游回归：它的 hook/build.dart 引用了当前 Dart SDK 里不存在的
# Architecture.arm64e，导致 Linux 上 `flutter test` 的原生资产构建阶段直接失败
# （Building native assets for package:objective_c failed）。它是 transitive 依赖，
# CI 每次 flutter pub get 都会浮动到最新版，所以必须显式压回可用的 9.6.0。
# 上游发布修复版本后应移除本段。
dependency_overrides:
  objective_c: 9.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

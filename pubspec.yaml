name: lt_dialogue
description: AI-driven Scene Dialogue, Resource Library & Settings System
publish_to: 'none'
version: 1.1.14+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^10.2.0
  connectivity_plus: ^7.1.1
  google_fonts: ^8.2.1
  flutter_svg: ^2.2.2
  pointycastle: ^4.0.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5

# objective_c 9.6.x 要求 meta ^1.19.0，而当前 Flutter SDK 固定 meta 1.18.0。
# 它是 transitive 依赖，CI 每次 flutter pub get 都会浮动到不兼容版本，
# 因此显式锁定到仍兼容当前 SDK 的 9.5.0。
dependency_overrides:
  objective_c: 9.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

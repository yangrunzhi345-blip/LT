name: lt_dialogue
description: AI-driven Scene Dialogue, Resource Library & Settings System
publish_to: 'none'
version: 1.1.2+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  http: ^1.2.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  flutter_tts: ^4.2.5
  flutter_secure_storage: ^10.2.0
  connectivity_plus: ^7.1.1
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  image: ^4.3.0
  flutter_svg: ^2.2.2
  pointycastle: ^4.0.0
  equatable: ^2.1.0
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
